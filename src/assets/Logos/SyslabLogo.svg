<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="syslabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="syslabGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main monitor frame -->
  <rect x="15" y="20" width="70" height="50" rx="4" fill="none" stroke="url(#syslabGradient)" stroke-width="3" filter="url(#syslabGlow)"/>
  <!-- Inner code lines -->
  <line x1="25" y1="35" x2="55" y2="35" stroke="url(#syslabGradient)" stroke-width="2" filter="url(#syslabGlow)"/>
  <line x1="25" y1="45" x2="75" y2="45" stroke="url(#syslabGradient)" stroke-width="2" filter="url(#syslabGlow)"/>
  <line x1="25" y1="55" x2="45" y2="55" stroke="url(#syslabGradient)" stroke-width="2" filter="url(#syslabGlow)"/>
  <!-- Cursor/Blinker -->
  <rect x="47" y="53" width="8" height="2" fill="#10B981" filter="url(#syslabGlow)"/>
  <!-- Base stand -->
  <path d="M40 70 L60 70 L65 80 L35 80 Z" fill="url(#syslabGradient)" filter="url(#syslabGlow)"/>
  <!-- Technical dots -->
  <circle cx="80" cy="25" r="2" fill="#10B981"/>
  <circle cx="20" cy="25" r="2" fill="#3B82F6"/>
</svg>
