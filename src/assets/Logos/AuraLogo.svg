<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#E8B4B8"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#9B59B6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#auraGradient)" stroke-width="2" opacity="0.6"/>
  <!-- Middle ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#auraGradient)" stroke-width="1.5" opacity="0.8"/>
  <!-- Central orb glow -->
  <circle cx="50" cy="50" r="25" fill="url(#orbGlow)"/>
  <!-- Inner core -->
  <circle cx="50" cy="50" r="15" fill="url(#auraGradient)" opacity="0.9"/>
  <!-- Highlight -->
  <circle cx="45" cy="45" r="5" fill="#FFD700" opacity="0.4"/>
</svg>
