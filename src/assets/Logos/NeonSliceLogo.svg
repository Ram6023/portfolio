<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF87"/>
      <stop offset="50%" style="stop-color:#60EFFF"/>
      <stop offset="100%" style="stop-color:#FF00FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="url(#neonGradient)" stroke-width="2"/>
  <!-- Slice marks -->
  <path d="M25 30 L75 70" stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M75 30 L25 70" stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Center gem/crystal -->
  <polygon points="50,25 65,50 50,75 35,50" fill="none" stroke="url(#neonGradient)" stroke-width="2" filter="url(#neonGlow)"/>
  <!-- Sparkles -->
  <circle cx="30" cy="35" r="2" fill="#00FF87" filter="url(#neonGlow)"/>
  <circle cx="70" cy="35" r="2" fill="#60EFFF" filter="url(#neonGlow)"/>
  <circle cx="50" cy="85" r="2" fill="#FF00FF" filter="url(#neonGlow)"/>
</svg>
